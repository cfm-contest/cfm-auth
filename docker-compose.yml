services:

  # ==========================================
  # PostgreSQL
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: cfm_db_auth
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - cfm_network


  # ==========================================
  # Redis
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: cfm_redis_auth
    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - cfm_network


  # ==========================================
  # Django-Bolt
  # ==========================================
  web:
    build:
      context: ./admin
      dockerfile: Dockerfile

    container_name: cfm_auth
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # PostgreSQL
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

    # Development uchun
    # Hostdagi admin/ container ichidagi /app bo'ladi
    volumes:
      - ./admin:/app

    # Faqat Django-Bolt tashqariga ochiladi
    ports:
      - "8888:8888"

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    # Container ishga tushganda:
    # 1. makemigrations
    # 2. migrate
    # 3. collectstatic
    # 4. superuser yaratish
    # 5. Django-Bolt
    command:
      - sh
      - -c
      - |
        set -e
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        python manage.py create_superuser || true
        python manage.py setwebhook
        exec python manage.py runbolt --host 0.0.0.0 --port 8888 --processes 4
    networks:
      - cfm_network


# ==========================================
# Volumes
# ==========================================

volumes:
  postgres_data:
  redis_data:


# ==========================================
# Network
# ==========================================

networks:
  cfm_network:
    driver: bridge